  <!--
    Question (2):
    Create HTML Page With: - html - head - title  - body
    - meta description
    - CSS place
    - JavaScript place
    - External CSS file
    - Text inside body

    Answer:
   -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- Meta Tags -->
  <meta name="description" content="This Is Description For My First Page">
  
  <!-- Title -->
  <title>My First Page</title>
  
  <!-- Internal CSS -->
  <style> </style>
  
  <!-- JavaScript -->
  <script> </script>

   <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Page Content -->
  <h1>This Is My First Page</h1>
  <p>Welcome to my first HTML page structured </p>
</body>
</html>

      Answer: No

  <!--  Question (4): 
  Multiple Line Comment مع شرح كل فائدة كل واحد فيهم عن طريق  Head داخل ال Meta قم بكتابة 4 عناصر 
 
    1. charset: defines the character encoding of the document
    2. viewport: controls layout on mobile browsers
    3. description: gives a short description of the page
    4. author: defines the name of the page author
  -->

  <!-- 1. Charset -->
  <meta charset="UTF-8">

  <!-- 2. Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 3. Description -->
  <meta name="description" content="This is my first HTML page">

  <!-- 4. Author -->
  <meta name="author" content="Nada reda">
    
  </body>
</html>
